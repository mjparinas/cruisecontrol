name: Build

# Docs-only changes skip the build, except AGENTS.md, which a test checks against the code.
on:
  push:
    branches: [main]
    paths: ['**', '!**.md', 'AGENTS.md']
  pull_request:
    paths: ['**', '!**.md', 'AGENTS.md']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Release script tests
        run: .github/scripts/next-version-test.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      # One Gradle invocation configures the project once and lets tests and the APK build run in parallel.
      - name: Unit tests and build APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: cruise-control-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0
      # Android Lint runs last; errors fail the build and warnings are only reported (see app/build.gradle.kts).
      - name: Android Lint
        run: |
          ./gradlew :app:lintDebug --stacktrace
          cat app/build/reports/lint-results-debug.txt
      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
