name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # One Gradle invocation configures the project once and lets tests and the APK build run in parallel.
      - name: Unit tests and build APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cruise-control-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0
      # Android Lint runs last and only reports for now (see the lint block in app/build.gradle.kts).
      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
