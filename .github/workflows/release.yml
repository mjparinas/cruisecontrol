name: Release

# Builds the APK and publishes it as a GitHub release.
# Start it from the Actions tab (Run workflow), or push a tag like v0.2.0. From the Actions tab the version is
# optional: leave it empty to release the next patch version after the latest tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to create, like v0.2.0. Leave empty for the next patch version.
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pick version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            VERSION="$REQUESTED"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' | .github/scripts/next-version.sh)"
            echo "No version entered, so releasing $VERSION."
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set, so this APK is signed with a throwaway debug key and won't install over earlier releases."
          fi
      - name: Test and build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ env.VERSION }}
          # Release numbers only go up, so each APK counts as an update to the last one.
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :core:test :app:assembleRelease --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.VERSION }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "cruise-control-$TAG.apk"
          # The app's auto-release may have created the release already; then just attach the APK.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "cruise-control-$TAG.apk" --clobber
          else
            gh release create "$TAG" "cruise-control-$TAG.apk" --title "Cruise Control $TAG" --target "$GITHUB_SHA" --generate-notes
          fi
